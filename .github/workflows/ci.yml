name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # A suite `unit` nao precisa de infraestrutura, entao roda antes de
      # gastar minutos subindo contêiner: um erro de logica pura falha em
      # segundos em vez de esperar o Postgres.
      - name: Test (unit)
        run: pnpm test:unit

      # O runner tem daemon de Docker, entao `pnpm db:start` escolhe o caminho
      # oficial — `supabase start`, com Postgres, Auth e Storage — e nao o plano
      # B sem Docker. O `db:reset` em seguida nao e redundancia: ele apaga e
      # reaplica as migrations do zero, que e a propria pergunta que a suite
      # `rls` existe para responder.
      - name: Start Supabase
        run: pnpm db:start

      - name: Migrations and seed
        run: pnpm db:reset

      # `test:rls` fala com o Postgres direto, e falha FECHADA quando nao acha
      # banco — nunca pula. Foi essa falha honesta que apareceu no CI enquanto
      # os passos acima nao existiam (.claude/rules/testing.md).
      - name: Test (rls)
        run: pnpm test:rls

      - name: Build
        run: pnpm build

      - name: Stop Supabase
        if: always()
        run: pnpm db:stop
